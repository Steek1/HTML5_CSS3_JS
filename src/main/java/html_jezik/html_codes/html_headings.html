<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Zaglavlja HTML Dokumenta</title>
</head>
<body style="background: linear-gradient(to top, #FAD0C4, #FECFEF);
min-height: 100vh;
margin: 0;
font-family: 'Segoe UI';
color: white;">
<h1>Practice HTML </h1>

<p>Click on one of the planets to get redirected to detailed wikipedia page for which planet interests you the most.</p>

<img src="https://www.w3schools.com/tags/planets.gif" alt="milky-way" usemap="#planetmap" style="width:146px;height:126px;">

<map name="planetmap">
    <area shape="rect" coords="0,0,82,126" alt="Sun" href="https://en.wikipedia.org/wiki/Sun" target="_blank">
    <area shape="circle" coords="90,58,3" alt="Mercury" href="https://en.wikipedia.org/wiki/Mercury_(planet)" target="_blank">
    <area shape="circle" coords="124,58,8" alt="Venus" href="https://en.wikipedia.org/wiki/Venus" target="_blank">

</map>
<br>
<svg width="340" height="300"
     xmlns="http://www.w3.org/2000/svg">

    <rect x="20" y="15" height="100" width="300" fill="#27D3F5" stroke="#F54927" stroke-width="3"></rect>
    <text x="125" y="70">Hello World</text>

    <circle cx="80" cy="180" r="50"/>
    <line x1="40" y1="300" x2="200" y2="300" stroke-width="4" stroke="#F54927"/>

    <polyline points="30 55,60 25,100 65,140 20,185 70,230 15,280 75, 340 10, 400 85, 460 5" stroke-width="4" stroke="#F54927" fill="none"/>

</svg>


</body>
</html>
